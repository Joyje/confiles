#!/bin/bash
# _____                        ____             __ _       
#|_   _| __ ___  _   ___  __  / ___|___  _ __  / _(_) __ _ 
#  | || '_ ` _ \| | | \ \/ / | |   / _ \| '_ \| |_| |/ _` |
#  | || | | | | | |_| |>  <  | |__| (_) | | | |  _| | (_| |
#  |_||_| |_| |_|\__,_/_/\_\  \____\___/|_| |_|_| |_|\__, |
#                                                    |___/ 
########################################################################################
set-option -g default-shell $SHELL
########################################################################################
# ____  _             _           
#|  _ \| |_   _  __ _(_)_ __  ___ 
#| |_) | | | | |/ _` | | '_ \/ __|
#|  __/| | |_| | (_| | | | | \__ \
#|_|   |_|\__,_|\__, |_|_| |_|___/
#               |___/             
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

########################################################################################
# ____  _             _         ____       _   _   _                 
#|  _ \| |_   _  __ _(_)_ __   / ___|  ___| |_| |_(_)_ __   __ _ ___ 
#| |_) | | | | |/ _` | | '_ \  \___ \ / _ \ __| __| | '_ \ / _` / __|
#|  __/| | |_| | (_| | | | | |  ___) |  __/ |_| |_| | | | | (_| \__ \
#|_|   |_|\__,_|\__, |_|_| |_| |____/ \___|\__|\__|_|_| |_|\__, |___/
#               |___/                                      |___/     
set -g @resurrect-processes 'lf'
set -g @resurrect-hook-pre-restore-pane-processes 'tmux switch-client -n && \
	tmux kill-session -t=$USER'
set -g @continuum-restore 'on'

########################################################################################
# ___       _ _     _____ ____  __  __ 
#|_ _|_ __ (_) |_  |_   _|  _ \|  \/  |
# | || '_ \| | __|   | | | |_) | |\/| |
# | || | | | | |_    | | |  __/| |  | |
#|___|_| |_|_|\__|   |_| |_|   |_|  |_|
#                                      
run '~/.config/tmux/plugins/tpm/tpm'

########################################################################################
#    _         _          ____           _         
#   / \  _   _| |_ ___   |  _ \ ___  ___(_)_______ 
#  / _ \| | | | __/ _ \  | |_) / _ \/ __| |_  / _ \
# / ___ \ |_| | || (_) | |  _ <  __/\__ \ |/ /  __/
#/_/   \_\__,_|\__\___/  |_| \_\___||___/_/___\___|
#                                                  
bind-key -n M-1 select-pane -t :.0 \; resize-pane -t :.0 -y 20
bind-key -n M-2 select-pane -t :.1 \; resize-pane -t :.1 -x 120 -y 45
bind-key -n M-3 select-pane -t :.2 \; resize-pane -t :.2 -x 120 -y 45
